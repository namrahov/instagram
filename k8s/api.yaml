# API pods: serve HTTP and publish outbox events to Kafka, but do not transcode (VIDEO_WORKER_ENABLED=false).
# Splitting the roles lets KEDA scale the expensive workers on lag while the API scales on its own traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instagram-api
  namespace: instagram
  labels:
    app: instagram
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: instagram
      component: api
  template:
    metadata:
      labels:
        app: instagram
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: instagram:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: instagram-config
            - secretRef:
                name: instagram-secrets
          env:
            - name: VIDEO_WORKER_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: instagram-api
  namespace: instagram
spec:
  selector:
    app: instagram
    component: api
  ports:
    - name: http
      port: 80
      targetPort: http
