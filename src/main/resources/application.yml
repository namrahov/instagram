spring:
  application:
    name: instagram
  datasource:
    url: jdbc:postgresql://localhost:5433/instagram
    username: postgres
    password: Genius33Frozen
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for all in-sync replicas; idempotence stops broker-side duplicates on producer retries.
      acks: all
      properties:
        enable.idempotence: true
        # send() blocks up to this long when the broker is unreachable (default 60 s) while outbox rows are claimed.
        max.block.ms: 5000
    consumer:
      # A new consumer group starts from the beginning, so no event published before it existed is skipped.
      auto-offset-reset: earliest
      properties:
        # Every KEDA scale-up/down is a group rebalance. With the default (eager) assignor all consumers stop and
        # hand back every partition; with cooperative-sticky only the partitions that must move are revoked, so
        # workers in the middle of a transcode keep going.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
  lifecycle:
    # On shutdown (e.g. KEDA scaling down) wait this long for running work. Must be >= video-worker.shutdown-timeout.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  # 8080 is taken by the twitter app.
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

instagram:
  kafka:
    video-processing:
      # Upper bound on parallel video workers in one consumer group (section 5). 3 locally; k8s uses 100.
      partitions: ${VIDEO_PROCESSING_PARTITIONS:3}
      replicas: ${VIDEO_PROCESSING_REPLICAS:1}
  video-worker:
    # false on API pods: they only publish events; the video-worker deployment consumes them.
    enabled: ${VIDEO_WORKER_ENABLED:true}
    # Kafka consumers in this process. 1 per pod on k8s, so one pod = one partition and KEDA's math holds.
    concurrency: ${VIDEO_WORKER_CONCURRENCY:3}
    # On shutdown, how long the worker may finish the job in hand before the record is left for another pod.
    shutdown-timeout: ${VIDEO_WORKER_SHUTDOWN_TIMEOUT:30s}
  storage:
    # The backend talks to MinIO/S3 through this address. Locally: our own MinIO from docker-compose.yml.
    endpoint: ${MINIO_ENDPOINT:http://localhost:9100}
    # Presigned URLs are signed for this host, so it must be the address the mobile client can reach.
    # In production it differs from the internal endpoint (e.g. https://media.example.com vs http://minio:9000).
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9100}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:instagram}
    secret-key: ${MINIO_SECRET_KEY:instagram-local-secret}
    bucket: ${MINIO_BUCKET:instagram}
  cdn:
    # Section 8: playbackUrl host. Locally the nginx cache in front of MinIO (docker-compose.yml, service cdn).
    base-url: ${CDN_BASE_URL:http://localhost:8090}
  media:
    # How long the client may use the upload URL. Short, so a leaked URL is useless soon.
    upload-url-ttl: ${MEDIA_UPLOAD_URL_TTL:15m}
    download-url-ttl: ${MEDIA_DOWNLOAD_URL_TTL:15m}
    max-image-size: ${MEDIA_MAX_IMAGE_SIZE:20MB}
    max-video-size: ${MEDIA_MAX_VIDEO_SIZE:1GB}
    # Files above this are uploaded in parts (section 3): a lost connection only costs the unfinished part.
    multipart-threshold: ${MEDIA_MULTIPART_THRESHOLD:100MB}
    # Small enough to re-send cheaply on a mobile network; S3 needs at least 5MB.
    multipart-part-size: ${MEDIA_MULTIPART_PART_SIZE:10MB}
    # A multipart upload may be resumed until this long after it started.
    multipart-session-ttl: ${MEDIA_MULTIPART_SESSION_TTL:24h}
    cleanup:
      # ISO-8601 duration: how often unfinished uploads past their deadline are discarded.
      interval: ${MEDIA_CLEANUP_INTERVAL:PT10M}
      grace: ${MEDIA_CLEANUP_GRACE:1h}
      batch-size: ${MEDIA_CLEANUP_BATCH_SIZE:100}
  transcoding:
    # ffmpeg/ffprobe on PATH by default; set full paths if they are not.
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    work-dir: ${TRANSCODING_WORK_DIR:${java.io.tmpdir}/instagram-transcoding}
    # Short side of each rendition. Heights above the source are skipped (no upscaling).
    heights: 360,720,1080
    # One ffmpeg run is killed after this long.
    timeout: ${TRANSCODING_TIMEOUT:20m}
    # Section 7. A claimed rendition is ours for lease-duration; the heartbeat extends it every heartbeat-interval
    # while ffmpeg runs. A dead worker's rendition can be claimed again once its lease runs out.
    lease-duration: ${TRANSCODING_LEASE_DURATION:5m}
    heartbeat-interval: ${TRANSCODING_HEARTBEAT_INTERVAL:90s}
    # Sweeper: re-queues videos whose worker lease ran out more than sweeper-grace ago (ISO-8601 interval).
    sweeper-interval: ${TRANSCODING_SWEEPER_INTERVAL:PT1M}
    sweeper-grace: ${TRANSCODING_SWEEPER_GRACE:1m}
