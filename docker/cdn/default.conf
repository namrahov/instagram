# A one-node "CDN edge" (section 8): caches video files from the MinIO origin.
#   hit  → served from local disk, the origin is not asked
#   miss → fetched from the origin once, stored, then served
# Every file lives under a versioned path (videos/{id}/v{n}/...) and never changes, so the origin marks it
# "immutable, max-age=1 year" and nothing ever has to be invalidated: a new version is a new URL.

proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=videos:10m max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;

    # Small HLS player for trying playback in a browser.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /videos/ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://minio:9000/instagram/videos/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache videos;
        # The path is the whole identity of a file; query strings must not split or bust the cache.
        proxy_cache_key $uri;
        # How long to keep a response comes from the origin's Cache-Control. This applies only when it sends none:
        # a missing object (MinIO answers 403/404) is remembered briefly, so a hot wrong URL does not hammer it.
        proxy_cache_valid 403 404 10s;
        # Request collapsing: 100 parallel misses for one segment make one origin request; the rest wait for it.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # Origin down: keep serving what we have.
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;

        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-minio-deployment-id;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Cache-Status $upstream_cache_status always;
        # Web players (hls.js) load playlists and segments with fetch/XHR, from another origin than this one.
        add_header Access-Control-Allow-Origin * always;
    }
}
