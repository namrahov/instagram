# Local storage and CDN for the instagram app (section 8). PostgreSQL and Kafka are the shared ones (twitter's).
#
#   docker compose up -d
#
#   MinIO API      http://localhost:9100   (the app's storage endpoint)
#   MinIO console  http://localhost:9101   (instagram / instagram-local-secret)
#   CDN            http://localhost:8090   (nginx proxy_cache in front of MinIO; / is a small HLS test player)
name: instagram

services:
  minio:
    # MinIO no longer publishes images on Docker Hub; this one is built locally (MINIO_IMAGE to use another).
    image: ${MINIO_IMAGE:-ecis-local/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-instagram}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-instagram-local-secret}
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once: creates the bucket and lets anyone GET under videos/ (what the CDN fetches).
  # Originals under media/ stay private: only presigned URLs can read them.
  # Production would keep the whole bucket private and let only the CDN in (CloudFront OAC / signed origin requests).
  minio-init:
    image: ${MC_IMAGE:-ecis-local/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-instagram}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-instagram-local-secret}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
             mc mb --ignore-existing local/instagram &&
             mc anonymous set download local/instagram/videos"
    restart: "no"

  cdn:
    image: nginx:1.28-alpine
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./docker/cdn/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/cdn/html:/usr/share/nginx/html:ro
      - cdn-cache:/var/cache/nginx/cdn

volumes:
  minio-data:
  cdn-cache:
